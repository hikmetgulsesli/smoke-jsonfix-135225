<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sıfırlama Onay</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#d8e2ff",
                      "secondary-container": "#3a4a5f",
                      "tertiary-fixed-dim": "#ffb786",
                      "secondary-fixed": "#d3e4fe",
                      "surface-container": "#171f33",
                      "on-surface-variant": "#c2c6d6",
                      "background": "#0b1326",
                      "inverse-primary": "#005ac2",
                      "surface-container-highest": "#2d3449",
                      "surface-dim": "#0b1326",
                      "surface-bright": "#31394d",
                      "error-container": "#93000a",
                      "surface-container-lowest": "#060e20",
                      "on-tertiary-fixed-variant": "#723600",
                      "primary-container": "#4d8eff",
                      "surface-container-high": "#222a3d",
                      "on-secondary-fixed": "#0b1c30",
                      "surface-variant": "#2d3449",
                      "secondary": "#b7c8e1",
                      "secondary-fixed-dim": "#b7c8e1",
                      "tertiary-container": "#df7412",
                      "on-error": "#690005",
                      "on-tertiary": "#502400",
                      "on-secondary-container": "#a9bad3",
                      "on-error-container": "#ffdad6",
                      "primary-fixed-dim": "#adc6ff",
                      "on-primary-fixed-variant": "#004395",
                      "on-primary": "#002e6a",
                      "primary": "#adc6ff",
                      "on-surface": "#dae2fd",
                      "on-background": "#dae2fd",
                      "tertiary": "#ffb786",
                      "on-secondary-fixed-variant": "#38485d",
                      "inverse-surface": "#dae2fd",
                      "tertiary-fixed": "#ffdcc6",
                      "on-secondary": "#213145",
                      "inverse-on-surface": "#283044",
                      "surface-tint": "#adc6ff",
                      "outline": "#8c909f",
                      "on-tertiary-container": "#461f00",
                      "on-tertiary-fixed": "#311400",
                      "on-primary-fixed": "#001a42",
                      "outline-variant": "#424754",
                      "surface": "#0b1326",
                      "surface-container-low": "#131b2e",
                      "error": "#ffb4ab",
                      "on-primary-container": "#00285d"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": ["Inter"],
                      "display": ["Inter"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              },
              "fontSize": {}
            },
          },
        }
      </script>
<style>
        body { font-family: 'Inter', sans-serif; }
      </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden">
<!-- Dimmed Background Content (Counter Screen) -->
<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-30 filter blur-sm transition-all duration-300">
<div class="flex flex-col items-center justify-center space-y-12">
<h1 class="text-[8rem] font-black tracking-[-0.02em] text-primary leading-none">42</h1>
<div class="flex space-x-8">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center text-primary shadow-[0_0_32px_rgba(173,198,255,0.1)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">remove</span>
</div>
<div class="w-20 h-20 rounded-full bg-surface-container-highest flex items-center justify-center text-primary shadow-[0_0_48px_rgba(173,198,255,0.2)]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">add</span>
</div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-background/60 backdrop-blur-md">
<!-- Modal Content -->
<div class="bg-surface-container-low rounded-2xl w-full max-w-sm overflow-hidden flex flex-col shadow-[0_32px_64px_rgba(11,19,38,0.8),0_0_0_1px_rgba(218,226,253,0.05)] relative transform transition-all scale-100 opacity-100">
<!-- Glow Effect -->
<div class="absolute -top-24 -left-24 w-48 h-48 bg-error/10 rounded-full blur-[64px] pointer-events-none"></div>
<div class="p-8 pb-6 flex flex-col items-center text-center relative z-10">
<div class="w-12 h-12 rounded-full bg-error-container/30 flex items-center justify-center text-error mb-6">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h2 class="font-headline font-bold text-2xl text-on-surface mb-3 tracking-tight">Sayacı Sıfırla?</h2>
<p class="font-body text-on-surface-variant text-sm leading-relaxed mb-8">
                    Sayaç sıfırlanacak. Bu işlem geri alınamaz. Onaylıyor musunuz?
                </p>
<div class="flex flex-col w-full space-y-3">
<button class="w-full bg-error text-on-error font-label font-bold text-xs tracking-widest uppercase py-4 rounded-xl hover:bg-error/90 active:scale-[0.98] transition-all shadow-[0_8px_16px_rgba(255,180,171,0.1)] flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">delete</span>
<span>EVET, SIFIRLA</span>
</button>
<button class="w-full bg-transparent text-on-surface font-label font-bold text-xs tracking-widest uppercase py-4 rounded-xl hover:bg-surface-container-highest active:scale-[0.98] transition-all border border-outline-variant/30">
                        İPTAL
                    </button>
</div>
</div>
</div>
</div>
</body></html>
